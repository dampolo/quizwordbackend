services:
  db:
    image: postgres:17

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    env_file:
      - .env

    depends_on:
      - db

    ports:
      - "8000:8000"
    
    volumes:
    - .:/app

    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data: